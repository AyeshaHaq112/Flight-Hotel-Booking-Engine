[project]
name = "flightdb"
version = "0.1.0"
description = "Flight & hotel booking engine — database learning exercise"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-env",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flightdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
env = [
    "DATABASE_URL=postgresql+psycopg://flight:flight@localhost:5432/flightdb_test",
]
